<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi página estilo Gotham</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      color: #f0f0f0;
      text-align: center;
      background: linear-gradient(rgba(0,0,0,0.8), rgba(30,30,30,0.9)), url('https://images.unsplash.com/photo-1602526216230-6e9f1e3b0f3e?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      font-size: 3em;
      text-shadow: 2px 2px 8px #000;
    }

    img {
      width: 200px;
      margin-top: 20px;
      filter: drop-shadow(0 0 10px #000);
    }
  </style>
</head>
<body>
  <h1>🦇 Esta es mi página web</h1>
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/Batman_logo.svg/1024px-Batman_logo.svg.png" alt="Símbolo de Batman">
</body>
</html>
